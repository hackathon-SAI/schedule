<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Study Planner</title>

  <!-- CSS -->
  <link rel="stylesheet" href="css/style.css">
  <script>window.API_BASE_URL = "https://schedule-backend-navy.vercel.app";</script>
  <style>
    body {
      visibility: hidden;
    }

    body.authenticated {
      visibility: visible;
    }
  </style>

  <!-- FullCalendar -->
  <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.18/index.global.min.css" rel="stylesheet">

</head>

<body>

  <!-- =========================
            ヘッダー
    ========================== -->

  <header>

    <!-- メニューボタン -->
    <button id="menuButton" type="button" aria-label="メニューを開く" aria-controls="menuPanel" aria-expanded="false">☰</button>

    <div class="logo">
      <h1>Study Planner</h1>
    </div>

    <div class="header-right">

      <div id="clock"></div>

      <button id="addTaskButton">
        ＋ 課題追加
      </button>

      <button id="addScheduleButton">
        ＋ 予定追加
      </button>

    </div>

  </header>
  <!-- =========================
        ダッシュボード
    ========================= -->

  <section class="dashboard">

    <div class="dashboard-card">

      <h3>課題数</h3>

      <p id="taskCount">0</p>

    </div>

    <div class="dashboard-card">

      <h3>今日の締切</h3>

      <p id="todayTaskCount">0</p>

    </div>

    <div class="dashboard-card">

      <h3>優先度：高</h3>

      <p id="highPriorityCount">0</p>

    </div>

  </section>

  <!-- =========================
        メニュー
    ========================= -->

  <div id="menuPanel">

    <button id="shareMenuButton">
      👥 グループ共有
    </button>

    <button id="calendarMenuButton">
      📅 カレンダー
    </button>

    <button id="taskMenuButton">
      📝 課題一覧
    </button>

    <button id="scheduleMenuButton">
      📅 予定一覧
    </button>

    <button id="profileMenuButton">
      👤 プロフィール
    </button>

    <button id="logoutButton">
      ログアウト
    </button>

  </div>

  <!-- =========================
        課題一覧パネル
    ========================= -->

  <div id="taskPanel" class="overlay-panel" hidden>

    <div class="panel-header">

      <h2>📝 課題一覧</h2>

      <button class="closePanel" data-panel="taskPanel">
        ×
      </button>

    </div>

    <div id="taskList"></div>

  </div>

  <!-- =========================
        予定一覧パネル
    ========================= -->

  <div id="schedulePanel" class="overlay-panel" hidden>

    <div class="panel-header">

      <h2>📅 予定一覧</h2>

      <button class="closePanel" data-panel="schedulePanel">
        ×
      </button>

    </div>

    <div id="scheduleList">
      予定がありません。
    </div>

  </div>

  <!-- =========================
        グループ共有パネル
    ========================= -->

  <div id="groupPanel" class="overlay-panel" hidden>

    <div class="panel-header">

      <h2>👥 グループ共有</h2>

      <button class="closePanel" data-panel="groupPanel" aria-label="閉じる">
        ×
      </button>

    </div>

    <div class="group-form">
      <h3>グループを作成する</h3>
      <label for="groupName">グループ名</label>
      <input type="text" id="groupName" maxlength="50" placeholder="例：クラスの課題共有">
      <button id="createGroupButton" type="button">グループ作成</button>
    </div>

    <hr>

    <div class="group-form">
      <h3>グループに参加する</h3>
      <label for="inviteCode">招待コード</label>
      <input type="text" id="inviteCode" placeholder="招待コードを入力">
      <button id="joinGroupButton" type="button">グループに参加</button>
    </div>

    <p id="shareMessage" role="status" aria-live="polite"></p>
    <div id="groupInfo"></div>
    <section id="groupDetails" hidden aria-live="polite">
      <nav class="group-tabs" role="tablist" aria-label="グループ情報">
        <button type="button" class="group-tab active" role="tab" aria-selected="true" data-group-tab="overview">概要</button>
        <button type="button" class="group-tab" role="tab" aria-selected="false" data-group-tab="events">予定一覧</button>
      </nav>
      <div id="groupOverview" class="group-tab-content">
        <h3 id="groupTitle"></h3>
        <p id="groupRole"></p>
        <p id="groupInviteCode"></p>
        <button id="copyGroupInviteCode" type="button">招待コードをコピー</button>
        <h3>メンバー</h3>
        <ul id="groupMembers"></ul>
      </div>
      <div id="groupEventsView" class="group-tab-content" hidden>
        <h3>グループの予定</h3>
        <div id="groupEvents"></div>
      </div>
    </section>

  </div>


  <!-- =========================
            メイン画面
    ========================== -->

  <div class="container">

    <main>

      <!-- ホーム画面 -->
      <section class="calendar-section">
        <div id="calendar"></div>
      </section>

    </main>

  </div>

  <!-- =========================
            課題追加画面
    ========================== -->

  <div id="taskModal">


    <div class="modal-header">

      <h2>課題追加</h2>

      <button id="closeModal">

        ×

      </button>

    </div>



    <label>

      課題名

    </label>

    <input type="text" id="taskTitle" placeholder="課題名を入力">



    <label>

      提出期限

    </label>

    <input type="date" id="deadline">



    <label>

      課題をする日

    </label>

    <input type="date" id="studyDate">



    <label>

      必要時間（時間）

    </label>

    <input type="number" id="studyTime" min="1" max="24">



    <label>

      優先順位

    </label>

    <select id="priority">

      <option value="高">高</option>

      <option value="中">中</option>

      <option value="低">低</option>

    </select>



    <button id="saveTask">

      保存

    </button>

  </div>

  <!-- =========================
            予定追加画面
    ========================== -->

  <div id="scheduleModal">

    <div class="modal-header">

      <h2>予定追加</h2>

      <button id="closeScheduleModal">

        ×

      </button>

    </div>


    <label>

      予定名

    </label>

    <input type="text" id="scheduleTitle" placeholder="予定名を入力">


    <label>

      予定の日

    </label>

    <input type="date" id="scheduleDate">


    <label>

      開始時間

    </label>

    <input type="time" id="scheduleStartTime">


    <label>

      終了時間

    </label>

    <input type="time" id="scheduleEndTime">


    <label>

      メモ

    </label>

    <textarea id="scheduleMemo" placeholder="メモを入力"></textarea>


    <button id="saveSchedule">

      保存

    </button>

  </div>



  <!-- JavaScript -->

  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.18/index.global.min.js"></script>
    <script src="js/calendar.js"></script>
    <script src="js/task.js"></script>
    <script src="js/schedule.js"></script>
  <script src="js/common-auth.js"></script>
  <script src="js/app.js"></script>
  <script src="js/main.js"></script>
  <script src="js/menu.js"></script>
  <script src="js/share.js"></script>
