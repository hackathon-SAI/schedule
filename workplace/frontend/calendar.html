<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Study Planner</title>

  <!-- CSS -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/account-menu.css">
  <link rel="stylesheet" href="css/event-actions.css">
  <link rel="stylesheet" href="css/google-imports.css">
  <script src="js/theme.js" defer></script>
  <script>window.API_BASE_URL = "https://schedule-backend-navy.vercel.app";</script>
  <style>
    body {
      visibility: hidden;
    }

    body.authenticated {
      visibility: visible;
    }
  </style>

  <!-- FullCalendar -->
  <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.18/index.global.min.css" rel="stylesheet">

</head>

<body>

  <!-- =========================
            ヘッダー
    ========================== -->

  <header>

    <!-- メニューボタン -->
    <button id="menuButton" type="button" aria-label="メニューを開く" aria-controls="menuPanel" aria-expanded="false">☰</button>

    <div class="logo">
      <h1>Study Planner</h1>
    </div>

    <div class="header-right">

      <div id="clock"></div>

      <button id="addTaskButton">
        ＋ 課題追加
      </button>

      <button id="addScheduleButton">
        ＋ 予定追加
      </button>

      <div id="accountMenu" class="account-menu">
        <button id="accountMenuButton" class="account-menu-trigger" type="button" aria-label="アカウントメニューを開く" aria-controls="accountMenuPanel" aria-expanded="false">
          <span id="accountAvatarInitial" aria-hidden="true">?</span>
          <img id="accountAvatarImage" alt="" hidden>
        </button>
        <div id="accountMenuPanel" class="account-menu-panel" hidden>
          <div class="account-menu-summary">
            <strong id="accountMenuName"></strong>
            <span id="accountMenuEmail"></span>
          </div>
          <a href="profile.html">アカウント詳細</a>
          <button type="button" data-account-action="switch">別のアカウントでログイン</button>
          <button type="button" data-account-action="logout">ログアウト</button>
          <button type="button" class="account-menu-delete" data-account-action="delete">会員登録を解除</button>
        </div>
      </div>

    </div>

  </header>
  <!-- =========================
        ダッシュボード
    ========================= -->

  <section class="dashboard">

    <div class="dashboard-card">

      <h3>課題数</h3>

      <p id="taskCount">0</p>

    </div>

    <div class="dashboard-card">

      <h3>今日の締切</h3>

      <p id="todayTaskCount">0</p>

    </div>

    <div class="dashboard-card">

      <h3>優先度：高</h3>

      <p id="highPriorityCount">0</p>

    </div>

  </section>

  <section class="google-integrations" aria-labelledby="googleIntegrationsTitle">
    <div class="google-integrations-heading">
      <div>
        <h2 id="googleIntegrationsTitle">Google連携</h2>
        <p>Classroomの課題やGoogleカレンダーの予定を取得し、選択したグループへ追加できます。</p>
      </div>
      <button type="button" id="reauthorizeGoogleButton">Google連携を再認証</button>
    </div>
    <label for="googleImportGroup">追加先グループ</label>
    <select id="googleImportGroup">
      <option value="">グループを読み込み中...</option>
    </select>
    <div class="google-source-grid">
      <section>
        <div class="google-source-heading">
          <h3>Classroomの課題</h3>
          <button type="button" id="loadClassroomButton">課題を取得</button>
        </div>
        <p id="classroomMessage" class="google-source-message" role="status" aria-live="polite"></p>
        <div id="classroomItems" class="google-import-list"></div>
      </section>
      <section>
        <div class="google-source-heading">
          <h3>Googleカレンダー</h3>
          <button type="button" id="loadGoogleCalendarButton">予定を取得</button>
        </div>
        <p id="googleCalendarMessage" class="google-source-message" role="status" aria-live="polite"></p>
        <div id="googleCalendarItems" class="google-import-list"></div>
      </section>
    </div>
  </section>

  <!-- =========================
        メニュー
    ========================= -->

  <div id="menuPanel">

    <button id="shareMenuButton">
      👥 グループ共有
    </button>

    <button id="calendarMenuButton">
      📅 カレンダー
    </button>

    <button id="taskMenuButton">
      📝 課題一覧
    </button>

    <button id="scheduleMenuButton">
      📅 予定一覧
    </button>

  </div>

  <!-- =========================
        課題一覧パネル
    ========================= -->

  <div id="taskPanel" class="overlay-panel" hidden>

    <div class="panel-header">

      <h2>📝 課題一覧</h2>

      <button class="closePanel" data-panel="taskPanel">
        ×
      </button>

    </div>

    <div id="taskList"></div>

  </div>

  <!-- =========================
        予定一覧パネル
    ========================= -->

  <div id="schedulePanel" class="overlay-panel" hidden>

    <div class="panel-header">

      <h2>📅 予定一覧</h2>

      <button class="closePanel" data-panel="schedulePanel">
        ×
      </button>

    </div>

    <div id="scheduleList">
      予定がありません。
    </div>

  </div>

  <!-- =========================
            メイン画面
    ========================== -->

  <div class="container">

    <main>

      <!-- ホーム画面 -->
      <section class="calendar-section">
        <div id="calendar"></div>
      </section>

    </main>

  </div>

  <!-- =========================
            課題追加画面
    ========================== -->

  <div id="taskModal">


    <div class="modal-header">

      <h2>課題追加</h2>

      <button id="closeModal">

        ×

      </button>

    </div>



    <label>

      課題名

    </label>

    <input type="text" id="taskTitle" placeholder="課題名を入力">

    <label for="taskGroupId">保存先グループ</label>

    <select id="taskGroupId" required>
      <option value="">グループを読み込み中...</option>
    </select>



    <label>

      提出期限

    </label>

    <input type="date" id="deadline">



    <label>

      課題をする日

    </label>

    <input type="date" id="studyDate">



    <label>

      必要時間（時間）

    </label>

    <input type="number" id="studyTime" min="1" max="24">



    <label>

      優先順位

    </label>

    <select id="priority">

      <option value="高">高</option>

      <option value="中">中</option>

      <option value="低">低</option>

    </select>



    <button id="saveTask">

      保存

    </button>

  </div>

  <!-- =========================
            予定追加画面
    ========================== -->

  <div id="scheduleModal">

    <div class="modal-header">

      <h2>予定追加</h2>

      <button id="closeScheduleModal">

        ×

      </button>

    </div>


    <label>

      予定名

    </label>

    <input type="text" id="scheduleTitle" placeholder="予定名を入力">

    <label for="scheduleGroupId">保存先グループ</label>

    <select id="scheduleGroupId" required>
      <option value="">グループを読み込み中...</option>
    </select>


    <label>

      予定の日

    </label>

    <input type="date" id="scheduleDate">


    <label>

      開始時間

    </label>

    <input type="time" id="scheduleStartTime">


    <label>

      終了時間

    </label>

    <input type="time" id="scheduleEndTime">


    <label>

      メモ

    </label>

    <textarea id="scheduleMemo" placeholder="メモを入力"></textarea>


    <button id="saveSchedule">

      保存

    </button>

  </div>



  <!-- JavaScript -->

  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.18/index.global.min.js"></script>
    <script src="js/calendar.js"></script>
      <script src="js/event-actions.js"></script>
    <script src="js/event-creation.js"></script>
    <script src="js/event-duplicates.js"></script>
    <script src="js/google-imports.js"></script>
    <script src="js/task.js"></script>
    <script src="js/schedule.js"></script>
  <script src="js/common-auth.js"></script>
  <script src="js/account-menu.js"></script>
  <script src="js/app.js"></script>
  <script src="js/main.js"></script>
  <script src="js/menu.js"></script>
