<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Googleアカウント | Study Planner</title>
  <link rel="stylesheet" href="css/profile.css">
</head>

<body>
  <header class="header">
    <h1>Study Planner</h1>
    <a href="calendar.html" class="back-link">カレンダーに戻る</a>
  </header>

  <main class="profile-container">
    <section class="profile-card" aria-labelledby="profileTitle">
      <h2 id="profileTitle">ログイン中のGoogleアカウント</h2>
      <img id="userPicture" alt="Googleアカウントのプロフィール画像" hidden>

      <dl class="account-details">
        <div class="account-field">
          <dt>名前</dt>
          <dd id="userName">読み込み中...</dd>
        </div>
        <div class="account-field">
          <dt>Googleアカウント</dt>
          <dd id="userEmail">読み込み中...</dd>
        </div>
      </dl>

      <p id="profileMessage" role="status" aria-live="polite"></p>
    </section>
  </main>

  <script src="js/common-auth.js"></script>
  <script src="js/profile.js"></script>
</body>

</html>
